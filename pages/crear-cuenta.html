<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Sistema SAL</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <header class="navbar">
        <div class="container">
            <a href="../index.html" class="brand">
                <img src="../public/logos/logo-SAL.png" alt="Logo SAL" width="110" height="auto">
                <div>
                    <div class="brand-title">Sistema SAL</div>
                    <div class="brand-sub">SALUD · ATENCIÓN · VIDA</div>
                </div>
            </a>
            <button class="menu-toggle js-menu-toggle" aria-controls="public-nav" aria-expanded="false"
                aria-label="Abrir menú">☰</button>
            <nav class="nav-actions" id="public-nav">
                <a href="soporte.html">Soporte</a>
                <a href="login.html">Iniciar sesión</a>
            </nav>
        </div>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card" style="max-width: 620px;">
            <div style="text-align:center; margin-bottom:1.5rem;">
                <div class="brand-logo" style="display:inline-block; margin-bottom:.8rem;">SAL</div>
                <h1 style="font-family:var(--font-heading); font-size:1.8rem;">Crear cuenta</h1>
                <p class="text-muted">Regístrate para gestionar tus citas médicas en línea.</p>
            </div>
            <form id="userForm" novalidate>
                <div class="form-row">
                    <div class="form-group"><label for="nombre">Nombre</label><input id="nombre" class="form-control"
                            autocomplete="given-name" required><span id="errorNombre" class="error-text"></span></div>
                    <div class="form-group"><label for="apellido">Apellido</label><input id="apellido"
                            class="form-control" autocomplete="family-name" required><span id="errorApellido"
                            class="error-text"></span></div>
                </div>
                <div class="form-group"><label for="correo">Correo electrónico</label><input type="email" id="correo"
                        class="form-control" autocomplete="email" required><span id="errorCorreo"
                        class="error-text"></span></div>
                <div class="form-row">
                    <div class="form-group"><label for="cedula">Cédula</label><input id="cedula" class="form-control"
                            inputmode="numeric" maxlength="12" required><span id="errorCedula"
                            class="error-text"></span></div>
                    <div class="form-group"><label for="telefono">Teléfono</label><input id="telefono"
                            class="form-control" inputmode="numeric" maxlength="10" required><span id="errorTelefono"
                            class="error-text"></span></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label for="password">Contraseña (6 caracteres)</label><input
                            type="password" id="password" class="form-control" minlength="6" maxlength="6"
                            autocomplete="new-password" required><span id="errorPassword" class="error-text"></span>
                    </div>
                    <div class="form-group"><label for="confirmPassword">Confirmar contraseña</label><input
                            type="password" id="confirmPassword" class="form-control" autocomplete="new-password"
                            required><span id="errorConfirmPassword" class="error-text"></span></div>
                </div>
                <label style="display:flex; gap:.5rem; align-items:flex-start; margin-bottom:.5rem; font-size:.85rem;">
                    <input type="checkbox" id="terms" required style="margin-top:.25rem;">
                    <span>Acepto los términos de uso y la política de privacidad de SAL.</span>
                </label>
                <div id="errorDuplicado" class="form-message error" role="alert"></div>
                <div id="errorTerms" class="form-message error" role="alert"></div>
                <div id="registroExitoso" class="form-message success" role="status"></div>
                <div id="registroActions" style="display:none; margin-top:1rem;">
                    <a href="login.html" class="btn btn-primary" style="width:100%; display:block; text-align:center;">Iniciar sesión</a>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.5rem;">Crear
                    cuenta</button>
            </form>
            <p style="text-align:center; margin-top:1.25rem;" class="text-muted">¿Ya tienes cuenta? <a href="login.html"
                    style="color:var(--primary); font-weight:700;">Iniciar sesión</a></p>
        </div>
    </main>
    <script src="../scripts/app.js"></script>
    <script src="../scripts/registro.js"></script>
</body>

</html>
