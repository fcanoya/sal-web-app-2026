<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial | Sistema SAL</title>
    <link rel="stylesheet" href="../assets/css/main.css">
</head>

<body>
    <header class="navbar">
        <div class="container"><a href="dashboard.html" class="brand"><img src="../public/logos/logo-SAL.png"
                    alt="Logo SAL" width="110">
                <div>
                    <div class="brand-title">Sistema SAL</div>
                    <div class="brand-sub">SALUD · ATENCIÓN · VIDA</div>
                </div>
            </a><button class="menu-toggle js-menu-toggle" aria-controls="private-nav" aria-expanded="false">☰</button>
            <nav class="nav-actions" id="private-nav"><a href="dashboard.html">Inicio</a><a href="agenda.html">Agendar
                    cita</a><a href="citas.html">Mis citas</a><a href="historial.html"
                    aria-current="page">Historial</a><a href="especialidades.html">Especialidades</a><a
                    href="reportes.html">Reportes</a><a href="soporte.html">Soporte</a>
                <div class="nav-user"><span class="avatar" style="width:32px;height:32px;font-size:.8rem;"
                        data-user-initials>•</span><span data-user-name>Invitado</span><a href="../index.html"
                        class="js-logout">↪</a></div>
            </nav>
        </div>
    </header>
    <main class="container page-main">
        <div class="section-heading">
            <div>
                <h1 style="font-family:var(--font-heading);">Historial de citas</h1>
                <p class="text-muted">Consulta todas las citas que has gestionado.</p>
            </div><a class="btn btn-primary" href="agenda.html">＋ Nueva cita</a>
        </div>
        <div class="card" style="padding:0;overflow:hidden;">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Profesional</th>
                            <th>Especialidad</th>
                            <th>Fecha</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="../scripts/app.js"></script>
    <script>document.addEventListener("DOMContentLoaded", function () { const u = SAL.getCurrentUser(), rows = SAL.getAppointments().filter(a => !u || a.userId === u.id || a.userId === "guest").sort((a, b) => b.date.localeCompare(a.date)); document.getElementById("historyBody").innerHTML = rows.length ? rows.map(a => `<tr><td>${SAL.escapeHtml(a.doctor)}</td><td>${SAL.escapeHtml(a.specialty)}</td><td>${SAL.escapeHtml(a.date)} · ${SAL.escapeHtml(a.time)}</td><td><span class="badge-status ${a.status === "Cancelada" ? "badge-cancelada" : a.status === "Pendiente" ? "badge-pendiente" : "badge-confirmada"}">${SAL.escapeHtml(a.status)}</span></td></tr>`).join("") : '<tr><td colspan="4" class="empty-state">No hay registros todavía.</td></tr>'; });</script>
</body>

</html>
